<style>
/* Mis cuentas: una web para el móvil que se maneja como una app de iPhone.
   Un solo sistema: los tokens de :root. Superficies neutras, un único color de acción (índigo),
   y color de estado solo para avisar (verde entra, naranja vas justo, rojo te has pasado). */
:root{
  /* color */
  --bg:#f4f4f8; --surface:#fcfcfe; --surface-2:#ececf2; --field:#ececf2; --raised:#fcfcfe;
  --ink:#15151c; --muted:#62626d; --soft:#b9b9c4; --line:rgba(21,21,28,.1);
  --accent:#4f46e5; --accent-soft:rgba(79,70,229,.11); --on-accent:#ffffff;
  --good:#17803f; --warn:#a85600; --bad:#d92d20; --on-bad:#ffffff;
  --glass:rgba(252,252,254,.84); --scrim:rgba(14,14,18,.36); --shadow:0 8px 24px rgba(21,21,28,.08);
  /* tipo: crece con el tamaño de texto del iPhone (rem sobre el estilo de texto del sistema) */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;
  --t-display:2.824rem; --t-large:1.647rem; --t-title:1.294rem; --t-body:1rem; --t-sub:.882rem; --t-foot:.765rem; --t-cap:.706rem; --t-tab:11px; /* la barra de pestañas no crece, como en iOS */
  --t-num:min(var(--t-display),12vw); /* la cifra grande nunca se sale de la pantalla */
  /* espacio, radios, movimiento */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-s:12px; --r-l:20px; --r-full:999px;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.2,.8,.2,1);
  --brand:var(--accent); --on-brand:var(--on-accent);
  accent-color:var(--accent); caret-color:var(--accent);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e0e12; --surface:#1a1a21; --surface-2:#26262f; --field:#2e2e38; --raised:#22222a;
  --ink:#f2f2f6; --muted:#a0a0ac; --soft:#55555f; --line:rgba(242,242,246,.1);
  --accent:#8b85ff; --accent-soft:rgba(139,133,255,.16); --on-accent:#0e0e12;
  --good:#3dd68c; --warn:#ffb340; --bad:#ff6b5e; --on-bad:#0e0e12;
  --glass:rgba(34,34,42,.84); --scrim:rgba(0,0,0,.55); --shadow:0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
@media (prefers-contrast: more){:root{--line:rgba(21,21,28,.32); --muted:#4a4a54; --glass:var(--surface)}}
@media (prefers-contrast: more) and (prefers-color-scheme: dark){:root{--line:rgba(242,242,246,.32); --muted:#c4c4ce}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:17px;overflow-x:clip;-webkit-text-size-adjust:100%}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-body);line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) var(--gutter-r) calc(104px + env(safe-area-inset-bottom,0px)) var(--gutter-l)}
::selection{background:var(--accent-soft)}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s5)}
.view{display:flex;flex-direction:column;gap:var(--s6)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:var(--t-large);font-weight:700;letter-spacing:-.01em;line-height:1.15}
h2{font-size:var(--t-title);font-weight:700;letter-spacing:-.01em;line-height:1.2}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:var(--t-sub)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.pos-ok{color:var(--good)!important} .neg-bad{color:var(--bad)!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* controles */
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;font:inherit;font-size:var(--t-body);min-height:48px;padding:12px 14px;border-radius:var(--r-s);border:0;background-color:var(--field);color:var(--ink);min-width:0;-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--muted)}
input[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--bad)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:var(--t-foot);color:var(--muted);min-width:0}
/* Sin datos que enseñar: solo queda el aviso con Reintentar. */
.sindatos .view,.sindatos .mchips{display:none!important}
.ferr{font-size:var(--t-foot);color:var(--bad)}
.err{color:var(--bad);font-size:var(--t-sub)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:var(--s3)}
.primary,.ghost,.danger{border:0;border-radius:var(--r-full);min-height:50px;padding:0 20px;font-weight:600;font-size:var(--t-body)}
.primary{background:var(--accent);color:var(--on-accent)}
.ghost{background:var(--surface-2);color:var(--ink)}
.danger{background:none;color:var(--bad);min-height:44px}
.danger.solid{background:var(--bad);color:var(--on-bad)}
.primary:disabled,.ghost:disabled{opacity:.55}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;min-height:44px;padding:0}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--muted);padding:0}
.ibtn.acc{color:var(--accent)}
.ibtn svg.i{width:24px;height:24px}
.item,.lrow,.debt,.ebody,.primary,.ghost,.chips button,.wact button,.tabs button,.chip-acc,.mchips button{transition:transform .12s var(--ease)}
.item:active,.lrow:active,.debt:active,.ebody:active,.primary:active,.ghost:active,.chips button:active,.wact button:active,.tabs button:active,.chip-acc:active,.mchips button:active{transform:scale(.97)}

/* cabecera */
header.top{display:flex;flex-direction:column;gap:var(--s1);padding-top:var(--s3)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:44px}
.hact{display:flex;gap:0;margin-right:-10px}
.mchips{display:flex;align-self:stretch;gap:var(--s3);overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;
  margin-inline:calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r));padding:0 calc(50% - 40px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.mchips::-webkit-scrollbar{display:none}
.mchips button{flex:none;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;min-height:48px;padding:0 6px;border:0;background:none;color:var(--muted);font-size:var(--t-body);font-weight:600}
.mchips button::after{content:"";width:5px;height:5px;border-radius:50%;background:transparent}
.mchips button[aria-current="true"]{color:var(--ink);font-weight:700}
.mchips button[aria-current="true"]::after{background:var(--accent)}
@media (prefers-reduced-motion: no-preference){.mchips.flash button[aria-current="true"]{animation:flash 1s var(--ease)}}
@keyframes flash{30%{color:var(--accent)}}

.navbar{position:fixed;top:0;left:0;right:0;z-index:30;padding:calc(env(safe-area-inset-top,0px) + 10px) var(--gutter-r) 10px var(--gutter-l);text-align:center;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);
  display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s}
.navbar.on{opacity:1}
.navbar span:first-child{font-weight:600}
.navsub{font-size:var(--t-foot);color:var(--muted)}

/* barra de pestañas (flotante, como la de iOS) */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;width:min(440px,calc(100% - 24px));
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border:.5px solid var(--line);border-radius:var(--r-full);
  display:grid;grid-template-columns:repeat(5,1fr);padding:4px;box-shadow:var(--shadow)}
.tabs button{background:none;border:0;border-radius:var(--r-full);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:4px 0;font-size:var(--t-tab);font-weight:600;color:var(--muted);position:relative;min-width:0}
.tabs button span.l{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tabs button svg.i{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabs .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:var(--on-bad);font-size:var(--t-tab);line-height:18px;padding:0 5px;font-weight:700}
@media (prefers-reduced-transparency: reduce){.tabs,.navbar{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* grupos y listas */
.group{display:flex;flex-direction:column;gap:var(--s2)}
.ghrow{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:0 4px;flex-wrap:wrap;min-height:44px}
.ghrow.sm{min-height:0;padding-top:var(--s2)}
.ghrow.sm h3{font-size:var(--t-sub);font-weight:600}
.ghnote{font-size:var(--t-foot);color:var(--muted)}
.ghlink{background:none;border:0;color:var(--accent);font-weight:600;font-size:var(--t-sub);min-height:44px;padding:0 8px;margin-right:-8px;display:inline-flex;align-items:center;gap:4px}
.card{container-type:inline-size;background:var(--surface);border-radius:var(--r-l);padding:0 var(--s4);min-width:0}
.card.pad{padding:var(--s4)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px var(--s3);padding:10px 0;min-height:60px;align-items:center;border:0;border-top:.5px solid var(--line);background:none;text-align:left;width:100%;border-radius:0}
.list > :first-child,.list > .item:first-of-type{border-top:0}
.item > .ico{grid-row:span 2}
.item .c{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word}
.item .a{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;max-width:12em}
.item .a small{white-space:nowrap}
/* Con letra grande (o pantalla estrecha) el importe baja debajo del nombre en vez de cortarlo. */
@container (max-width: 19em){.item{grid-template-columns:auto minmax(0,1fr)}.item .a{text-align:left;max-width:none}}
.item .a small{font-size:var(--t-foot);font-weight:500;color:var(--muted)}
.item .a.neg-bad small{color:inherit}
.item .a.free{color:var(--muted)}
.item .s{grid-column:2/-1;font-size:var(--t-foot);color:var(--muted);min-width:0;overflow-wrap:anywhere}
.item .tag{color:var(--warn);font-weight:600}
.item .meter{grid-column:2/-1;margin-top:6px}
.ico{width:36px;height:36px;border-radius:10px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none}
.empty{padding:var(--s4) 0;color:var(--muted)}
.empty .linkbtn{display:block}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);min-height:48px;padding:10px 0;border:0;border-top:.5px solid var(--line);background:none;width:100%;text-align:left}
.lrow:first-child{border-top:0}
.lrow b{font-weight:500;color:var(--muted)}
.lrow.go{color:var(--accent);font-weight:600}
.meter{display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}

/* Resumen: la única tarjeta de color */
.wallet{--on-brand-2:color-mix(in srgb,var(--on-brand) 86%,transparent);--on-brand-f:color-mix(in srgb,var(--on-brand) 16%,transparent);background:var(--brand);color:var(--on-brand);border-radius:var(--r-l);padding:var(--s5) var(--s4) var(--s4);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.wlabel{font-size:var(--t-sub);font-weight:600;color:var(--on-brand-2)}
.wbig{font-size:var(--t-num);font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:2px 0 4px}
.wsub{font-size:var(--t-sub);color:var(--on-brand-2);margin-bottom:var(--s3)}
.wsub:empty{display:none}
.wacc{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;margin:var(--s2) calc(-1 * var(--s4)) 0;padding:0 var(--s4)}
.wacc::-webkit-scrollbar{display:none}
.chip-acc{flex:none;display:flex;align-items:center;gap:var(--s2);border:0;border-radius:var(--r-full);min-height:44px;padding:0 14px 0 6px;color:var(--on-brand);font-size:var(--t-sub);background:var(--on-brand-f)}
.chip-acc i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:var(--t-foot);background:var(--on-brand-f)}
.chip-acc span{font-weight:600} .chip-acc b{font-weight:500}
.wact{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:var(--s2);margin-top:var(--s4)}
.wact button{border:0;display:flex;align-items:center;justify-content:center;gap:var(--s2);min-height:48px;padding:6px 14px;border-radius:var(--r-full);font-size:var(--t-sub);font-weight:600;color:var(--on-brand);background:var(--on-brand-f)}
.wact button:first-child{background:var(--on-brand);color:var(--brand)}
.skw{display:block;height:var(--t-display);width:60%;border-radius:var(--r-s);background:var(--on-brand-f);margin:6px 0 8px}

/* cifra principal del resto de pestañas */
.hero{display:flex;flex-direction:column;gap:2px;padding:0 4px}
.hero .label{font-size:var(--t-sub);font-weight:600;color:var(--muted)}
.hero .big{font-size:var(--t-num);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.hero .big.txt{font-size:calc(var(--t-num) * .8)}
.hero .status{font-size:var(--t-sub);color:var(--muted);margin-top:2px}
.hero .status.ok{color:var(--accent);font-weight:600}
.hero .meter{margin-top:var(--s3)}

/* El mes que viene */
.proxsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);padding:var(--s4) 0 var(--s3);border-bottom:.5px solid var(--line)}
.proxsum span{display:block;font-size:var(--t-foot);color:var(--muted)}
.proxsum b{font-size:var(--t-title);font-weight:700;overflow-wrap:anywhere}
.psub{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);padding-top:var(--s3)}
.psub h3{font-size:var(--t-sub);font-weight:600;color:var(--muted)}
.psub + .item{border-top:0}

/* pagos del mes */
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2);align-items:center;padding:4px 0;border-top:.5px solid var(--line)}
.list > .check:first-child{border-top:0}
.tick{width:44px;height:44px;margin-left:-9px;display:grid;place-items:center;border:0;background:none;padding:0}
.tick svg{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted);padding:5px;fill:none;stroke:transparent;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion: no-preference){.tick svg{transition:background-color .2s,box-shadow .2s}}
.check.done .tick svg{background:var(--accent);box-shadow:none;stroke:var(--on-accent)}
.ebody{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--s3);align-items:baseline;background:none;border:0;padding:8px 0;text-align:left;width:100%;min-height:52px}
.ebody .c{min-width:0;overflow-wrap:break-word}
.ebody .num{font-weight:600}
.ebody .s{grid-column:1/-1;font-size:var(--t-foot);color:var(--muted)}
.ebody .seen{color:var(--ink);font-weight:500}

.bars{display:flex;align-items:flex-end;gap:0;height:160px;padding-top:28px}

// Error debajo del campo, con el foco en él.
function fieldErr(input, msg){
  input.setAttribute('aria-invalid', 'true');
  let e = $(input.id + '-e');
  if (!e) { e = document.createElement('p'); e.className = 'ferr'; e.id = input.id + '-e'; (input.closest('label') || input).after(e); input.setAttribute('aria-describedby', e.id); }
  e.textContent = msg; input.focus();
  input.addEventListener('input', () => { input.removeAttribute('aria-invalid'); e.remove(); }, {once: true});
}

// ---------- entrar ----------
function loginErr(msg){ $('loginErr').textContent = msg; $('loginErr').hidden = !msg; }
const leerClave = () => { try { return localStorage.getItem('cuentas.clave') || ''; } catch { return ''; } };
// Devuelve el cliente si la clave vale, 'red' si no hay conexión y null si la clave no vale.
async function probar(clave){
  const c = cliente(clave);
  try {
    const {data, error} = await c.from('topes').select('categoria').limit(1);
    if (error) return /fetch|network|load/i.test(error.message || '') ? 'red' : null;
    return data && data.length ? c : null;
  } catch { return 'red'; }
}
$('fLogin').addEventListener('submit', async e => {
  e.preventDefault(); loginErr('');
  const clave = $('pass').value.trim();
  $('goBtn').disabled = true;
  if (!clave) { $('goBtn').disabled = false; $('pass').setAttribute('aria-invalid', 'true'); return loginErr('Pega la clave para entrar.'); }
  const c = await probar(clave);
  $('goBtn').disabled = false;
  if (c === 'red') return loginErr('No hay conexión. Prueba otra vez cuando tengas internet.');
  if (!c) { $('pass').setAttribute('aria-invalid', 'true'); return loginErr('Esa clave no vale. Cópiala otra vez del chat.'); }
  $('pass').removeAttribute('aria-invalid');
  try { localStorage.setItem('cuentas.clave', clave); } catch {}
  sb = c; $('pass').value = ''; show(true);
});
function olvidar(){ try { localStorage.removeItem('cuentas.clave'); } catch {} sb = cliente(''); D = null; show(false); }
$('estadoBtn').onclick = () => load();

let shown = null;
function show(logged){
  if (shown === logged) return; shown = logged;
  $('login').hidden = logged; $('app').hidden = !logged; $('tabs').hidden = !logged;
  if (logged) { setView(view); load(); }
}

// ---------- datos ----------
async function all(table, select, order){
  let out = [], from = 0;
  for (;;) {
    let q = sb.from(table).select(select).range(from, from + 999);
    if (order) q = q.order(order, {ascending:false});
    const {data, error} = await q;
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) return out;
    from += 1000;
  }
}
function prepPago(p){ p.mes = monthKey(p.fecha); p.dia = dayKey(p.fecha); p.importe = Number(p.importe); return p; }
function prepDeuda(d){ ['pendiente','tin','cuota'].forEach(k => d[k] = d[k] == null ? null : Number(d[k])); return d; }
// Mientras llegan los datos, bloques grises con la forma de lo que viene.
const skRows = n => Array.from({length: n}, () => '<div class="skrow" aria-hidden="true"><span class="sk"></span><span class="sk w"></span><span class="sk"></span><span class="sk"></span></div>').join('');
function esqueleto(){
  $('wTotal').innerHTML = '<span class="skw" aria-label="Cargando"></span>';
  ['topes','prox','movs','fijos','cuotas','debts','topCom'].forEach(id => $(id).innerHTML = skRows(3));
  $('cats').innerHTML = skRows(3);
}
function estado(msg){ $('estado').hidden = !msg; $('estadoTxt').textContent = msg || ''; }
let cargadoEn = 0;
const COLS_PAGOS = 'id,fecha,con_hora,importe,comercio,categoria,tipo,cuenta,origen,creado';
async function load(){
  if (!D) esqueleto();
  $('app').setAttribute('aria-busy', 'true');
  $('estadoBtn').disabled = true;
  try {
    const [pagos, topes, plan, deudas, fijos, pm, saldos, ingresos] = await Promise.all([
      all('pagos', COLS_PAGOS, 'fecha'),
      all('topes', 'categoria,tope,incluye'),
      all('plan_mes', 'mes,ingresos,vida,deuda_final,nota'),
      all('deudas', '*'),
      all('gastos_fijos', '*'),
      all('pagos_mes', '*'),
      all('saldos', '*').catch(() => []),
      all('ingresos_fijos', '*').catch(() => []),
    ]);
    pagos.forEach(prepPago);
    topes.forEach(t => t.tope = Number(t.tope));
    plan.forEach(p => { p.mes = p.mes.slice(0,7); p.deuda_final = Number(p.deuda_final); p.vida = Number(p.vida); p.ingresos = Number(p.ingresos); });
    plan.sort((a,b) => a.mes.localeCompare(b.mes));
    deudas.forEach(prepDeuda);
    fijos.forEach(f => f.importe = Number(f.importe));
    pm.forEach(r => { r.mes = r.mes.slice(0,7); r.amortizado = Number(r.amortizado); });
    saldos.forEach(x => x.saldo = Number(x.saldo)); saldos.sort((a,b) => a.orden - b.orden);
    ingresos.forEach(i => i.importe = Number(i.importe));
    // Con una clave que ya no vale, la base de datos devuelve todo vacío.
    if (!topes.length) { olvidar(); return loginErr('La clave guardada ya no vale. Pégala otra vez.'); }
    D = {pagos, topes, plan, deudas, fijos, pm, saldos, ingresos};
    cargadoEn = Date.now(); estado(''); $('app').classList.remove('sindatos');
    render();
  } catch (err) {
    console.error(err);
    if (!D) $('app').classList.add('sindatos');
    estado(navigator.onLine === false ? 'No hay conexión. Lo que ves puede no estar al día.' : 'No se pudieron cargar los datos.');
  } finally { $('estadoBtn').disabled = false; $('app').removeAttribute('aria-busy'); }
}
// Escribe y comprueba que la fila existe (si la seguridad la bloquea, Supabase devuelve 0 filas sin error).
// Mientras guarda, los botones de la hoja no responden: un doble toque no crea dos filas.
let guardando = 0;
function ocupado(on){
  guardando += on ? 1 : -1;
  $('sheet').querySelectorAll('button[type=submit],.primary,.danger').forEach(b => {
    if (guardando) { if (!b.dataset.txt) { b.dataset.txt = b.textContent; if (b.type === 'submit') b.textContent = 'Guardando…'; } b.disabled = true; }
    else { if (b.dataset.txt) { b.textContent = b.dataset.txt; delete b.dataset.txt; } b.disabled = false; }
  });
}
async function write(q){
  ocupado(true);
  try {
    const {data, error} = await q.select();
    if (error) { console.error(error); toast(navigator.onLine === false ? 'No se guardó: no hay conexión.' : 'No se guardó. Prueba otra vez.'); error.avisado = true; throw error; }
    if (!data || !data.length) { toast('No se guardó: la clave no vale. Vuelve a pegarla.'); throw Object.assign(new Error('0 filas'), {avisado: true}); }
    return data;
  } finally { ocupado(false); }
}
$('sheet').addEventListener('submit', e => { if (guardando) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
$('sheet').addEventListener('click', e => { if (guardando && e.target.closest('button')) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);

function months(){
  const now = monthKey(new Date());
  const first = D.pagos.length ? D.pagos[D.pagos.length-1].mes : now;
  const out = []; for (let m = first; m <= addMonth(now, 1); m = addMonth(m, 1)) out.push(m);
  return out;
}
function categorias(){
  const s = new Set(D.pagos.map(p => p.categoria));
  D.topes.forEach(t => t.incluye.forEach(c => s.add(c)));
  ['Sin categoría','Ingreso','Movimiento interno','Pago de deuda','Entre personas'].forEach(c => s.add(c));
  return [...s].sort((a,b) => a.localeCompare(b,'es'));
}

const TITLES = {resumen:'Resumen', movs:'Movimientos', analisis:'Análisis', mes:'Pagos', deudas:'Deudas'};
function setView(v){
  view = v; try { localStorage.setItem('cuentas.view', v); } catch {}
  document.body.dataset.view = v;
  for (const k of Object.keys(TITLES)) $('v-'+k).hidden = k !== v;

  $('title').textContent = TITLES[v];
  $('hAdd').hidden = v !== 'movs';
  $('mchips').hidden = v === 'deudas';
  scrollTo(0, 0); navbar();
  if (D) render();
}

// Barra superior compacta al hacer scroll, como el título grande de iOS.

  const on = scrollY > 64 && !$('app').hidden;
  $('navbar').classList.toggle('on', on);
  $('navTitle').textContent = TITLES[view];

}
addEventListener('scroll', navbar, {passive: true});
// Al volver a la web, recarga solo si han pasado más de 5 minutos.
// Al volver a la web: si hace más de 5 minutos, todo; si no, solo los movimientos nuevos (los que mete el Atajo de Apple Pay).
document.addEventListener('visibilitychange', () => { if (document.hidden || !shown || !$('scrim').hidden) return; if (!D || Date.now() - cargadoEn > 5 * 60e3) load(); else nuevos(); });
async function nuevos(){
  const ult = D.pagos.reduce((m, p) => p.creado > m ? p.creado : m, '');
  if (!ult) return;
  const {data, error} = await sb.from('pagos').select(COLS_PAGOS).gt('creado', ult).order('fecha', {ascending: false});
  if (error || !data.length) return;
  const ya = new Set(D.pagos.map(p => p.id)), n = data.filter(p => !ya.has(p.id)).map(prepPago);
  if (!n.length) return;
  D.pagos.push(...n); D.pagos.sort((a,b) => b.fecha.localeCompare(a.fecha)); render();
  toast(n.length === 1 ? `Nuevo: ${n[0].comercio}, ${eur2(n[0].importe)}` : `${n.length} movimientos nuevos`);
}
$('hAdd').onclick = () => editPago(null);
$('hSet').onclick = () => ajustes();

function render(){
  const ms = months();
  if (!ms.includes(cur)) cur = ms[ms.length-1];
  // Meses como texto que se desliza; el elegido, en el centro y con el año.
  const corto = m => cap(monthName(m, {month: 'short'}).replace('.', '').replace('sept', 'sep'));
  $('mchips').innerHTML = ms.map(m => `<button data-m="${m}" aria-label="${cap(monthName(m))}"${m === cur ? ' aria-current="true"' : ''}>${corto(m)}${m === cur || m.endsWith('-01') ? ' ' + m.slice(0,4) : ''}</button>`).join('');
  $('mchips').querySelectorAll('button').forEach(b => b.onclick = () => { cur = b.dataset.m; movLimit = 60; render(); });
  const sel = $('mchips').querySelector('[aria-current="true"]');
  const centra = () => { const mc = $('mchips'), r = sel.getBoundingClientRect(), c = mc.getBoundingClientRect(); mc.scrollLeft += r.left - c.left - (c.width - r.width) / 2; };
  if (sel) { centra(); requestAnimationFrame(centra); }
  // El número de la pestaña: lo que está sin categoría este mes.
  const sinN = D.pagos.filter(p => p.categoria === 'Sin categoría' && p.mes === monthKey(new Date())).length;
  $('sinDot').hidden = !sinN; $('sinDot').textContent = sinN;
  $('sinDot').closest('button').setAttribute('aria-label', 'Movimientos' + (sinN ? `, ${sinN} sin categoría` : ''));
  ({resumen: renderResumen, movs: renderMovs, analisis: renderAnalisis, mes: renderMes, deudas: renderDeudas})[view]();
}

// ---------- resumen ----------
function deudaActual(){ return D.deudas.filter(d => !d.pagada).reduce((s,d) => s + d.pendiente, 0); }
const icon = cat => `<span class="ico" aria-hidden="true">${svg(cat)}</span>`;

function renderResumen(){
  renderDinero(); renderProximo();
  const {pagos, topes, plan} = D;
  const mp = pagos.filter(p => p.mes === cur);
  const gastos = mp.filter(p => p.tipo === 'Gasto');
  const enTope = new Set(topes.flatMap(t => t.incluye));
  const vida = gastos.filter(p => enTope.has(p.categoria));
  const vidaG = sum(vida);
  const planMes = plan.find(p => p.mes === cur);
  const vidaT = planMes ? planMes.vida : topes.reduce((s,t) => s + t.tope, 0);
  const now = monthKey(new Date());
  const dias = new Date(Date.UTC(+cur.slice(0,4), +cur.slice(5,7), 0)).getUTCDate();
  const hoy = cur === now ? Number(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',day:'numeric'}).format(new Date())) : (cur > now ? 0 : dias);
  const ritmo = vidaT * hoy / dias;
  $('vidaDe').textContent = vidaG > vidaT ? `Te has pasado ${eur(vidaG - vidaT)}` : `Quedan ${eur(vidaT - vidaG)} de ${eur(vidaT)}${vidaG > ritmo * 1.1 ? ', vas rápido' : ''}`;
  $('vidaDe').className = 'ghnote num' + (vidaG > vidaT ? ' neg-bad' : '');
  // Cuánto queda en cada tope, en el orden del plan. Los topes a 0 solo salen si hay gasto.
  $('topes').innerHTML = topes.map(t => ({t, g: sum(gastos.filter(p => t.incluye.includes(p.categoria)))}))
    .filter(({t, g}) => t.tope > 0 || g > 0.5).map(({t, g}) => {
      if (!t.tope) return `<button class="item tope" data-cat="${esc(t.incluye[0])}">${icon(t.incluye[0])}<span class="c">${esc(t.categoria)}</span>
        <span class="a num free">${eur(g)}</span><span class="s">Sin presupuesto este mes</span></button>`;
      const q = t.tope - g, over = q < 0, near = !over && t.tope && g > t.tope * hoy / dias * 1.1;
      const w = t.tope ? Math.min(100, g / t.tope * 100) : 100;
      return `<button class="item tope" data-cat="${esc(t.incluye[0])}">${icon(t.incluye[0])}<span class="c">${esc(t.categoria)}</span>
        <span class="a num ${over ? 'neg-bad' : ''}">${eur(over ? -q : q)}<small>${over ? ' de más' : ' libres'}</small></span>
        <span class="s num">Gastado ${eur(g)} de ${eur(t.tope)}${near ? ' · <span class="tag">vas rápido</span>' : ''}</span>
        <span class="meter ${over ? 'bad' : near ? 'warn' : ''}" role="img" aria-label="${Math.round(w)} % gastado"><i style="width:${w}%"></i></span></button>`;
    }).join('');
  $('topes').querySelectorAll('.tope').forEach(b => b.onclick = () => { const t = topes.find(x => x.incluye[0] === b.dataset.cat); catSel = {nombre: t.categoria, incluye: t.incluye}; busqueda = ''; $('search').value = ''; movLimit = 60; setView('movs'); });
}


// ---------- dinero real ----------
// Saldo de cada cuenta: el último dato que diste, menos lo que se ha movido en esa cuenta después.
const salida = p => p.tipo === 'Ingreso' ? -p.importe : p.importe;
// Saldo de hoy: el último que pusiste menos lo que se ha movido después. Cuenta lo apuntado después aunque su fecha sea anterior
// (un gasto que añades a mano resta siempre); los descuadres ya están dentro del saldo que pusiste.
const despues = (p, t) => Math.max(new Date(p.fecha).getTime(), p.creado ? new Date(p.creado).getTime() : 0) > t;
function saldoDe(s){ const t = new Date(s.a_fecha).getTime(); return s.saldo - D.pagos.filter(p => p.cuenta === s.cuenta && p.origen !== 'Descuadre' && despues(p, t)).reduce((a,p) => a + salida(p), 0); }
function renderDinero(){
  const ss = D.saldos.map(s => ({...s, ahora: saldoDe(s)}));
  const total = ss.reduce((a,s) => a + s.ahora, 0);
  $('wTotal').textContent = ss.length ? eur2(total) : 'Sin saldos';
  $('wAcc').innerHTML = ss.map(s => `<button class="chip-acc" data-c="${esc(s.cuenta)}" aria-label="${esc(s.cuenta)}: ${eur2(s.ahora)}. Poner saldos"><i aria-hidden="true">${esc(s.cuenta[0])}</i><span>${esc(s.cuenta)}</span><b class="num">${eur2(s.ahora)}</b></button>`).join('')
    || '<button class="chip-acc" data-c=""><span>Pon cuánto tienes en cada cuenta</span></button>';
  $('wAcc').querySelectorAll('.chip-acc').forEach(b => b.onclick = editSaldos);
  const now = monthKey(new Date());
  const m = cur === now ? estadoMes() : {items: []};
  const pend = m.items.filter(i => !i.done).reduce((a,i) => a + i.importe, 0);
  const queda = total - pend;
  $('wSub').textContent = cur === now && pend > 0 ? `${eur(queda)} tras los ${eur(pend)} que faltan por pagar` : '';
}
function editSaldos(){
  const cuentas = [...new Set([...D.saldos.map(s => s.cuenta), 'BBVA', 'Revolut', 'Efectivo'])];
  openSheet(`${hd('Poner saldos')}
    <p class="small muted">Mira el saldo en la app de cada banco y escríbelo. Desde aquí se irá ajustando solo con los movimientos nuevos.</p>
    <form id="fs" novalidate>
      ${cuentas.map((c, i) => { const s = D.saldos.find(x => x.cuenta === c); return `<label class="f">${esc(c)}<input inputmode="decimal" autocomplete="off" enterkeyhint="done" id="sal${i}" name="${esc(c)}" value="${s ? String(saldoDe(s).toFixed(2)).replace('.', ',') : ''}" placeholder="0,00"></label>`; }).join('')}
      <button class="primary" type="submit">Guardar</button>
    </form>`, sh => {
    sh.querySelector('#fs').onsubmit = async e => {
      e.preventDefault();
      const rows = []; let mal = null;
      cuentas.forEach((c,i) => { const inp = sh.querySelector(`input[name="${CSS.escape(c)}"]`), v = inp.value.trim(); if (v === '') return;
        const n = parseNum(v); if (isFinite(n)) rows.push({cuenta: c, saldo: r2(n), a_fecha: new Date().toISOString(), orden: i + 1}); else mal = mal || inp; });
      if (mal) return fieldErr(mal, 'Escribe solo el número, por ejemplo 385,69.');
      try {
        if (!rows.length) return closeSheet();
        // Lo que la app esperaba frente a lo que dice el banco.
        const desc = rows.map(x => { const s = D.saldos.find(y => y.cuenta === x.cuenta); return s ? {cuenta: x.cuenta, dif: r2(x.saldo - saldoDe(s)), fecha: x.a_fecha} : null; }).filter(d => d && Math.abs(d.dif) >= 1);
        const r = await write(sb.from('saldos').upsert(rows));
        r.forEach(x => { x.saldo = Number(x.saldo); const i = D.saldos.findIndex(s => s.cuenta === x.cuenta); if (i >= 0) D.saldos[i] = x; else D.saldos.push(x); });
        D.saldos.sort((a,b) => a.orden - b.orden);
        closeSheet(); render();
        if (desc.length) descuadre(desc); else toast('Saldos guardados, todo cuadra');
      } catch {}
    };
  });
}
// El banco no cuadra con la app: avisa y deja apuntarlo como gasto (o entrada) sin identificar.
function descuadre(desc){
  openSheet(`${hd('No cuadra')}
    ${desc.map(d => `<p class="desc"><b class="num ${d.dif < 0 ? 'neg-bad' : ''}">${eur2(Math.abs(d.dif))}</b> ${d.dif < 0 ? 'de menos' : 'de más'} en ${esc(d.cuenta)}.
      <span class="muted">${d.dif < 0 ? 'Han salido y no sabemos dónde han ido.' : 'Han entrado y no sabemos de dónde vienen.'}</span></p>`).join('')}
    <p class="small muted">El saldo ya está corregido. Si lo apuntas, sale en Movimientos como «Sin categoría» y luego le pones qué era.</p>
    <div class="actions"><button class="primary" id="dApuntar">Apuntarlo</button><button class="ghost" id="dNo">Ahora no</button></div>`, sh => {
    sh.querySelector('#dNo').onclick = closeSheet;
    sh.querySelector('#dApuntar').onclick = async () => {
      try {
        const r = await write(sb.from('pagos').insert(desc.map(d => ({comercio: `Sin identificar (${d.cuenta})`, importe: -d.dif, fecha: d.fecha, con_hora: true, categoria: 'Sin categoría', cuenta: d.cuenta, origen: 'Descuadre'}))));
        r.forEach(x => D.pagos.push(prepPago(x)));
        D.pagos.sort((a,b) => b.fecha.localeCompare(a.fecha));
        closeSheet(); render(); toast('Apuntado');
      } catch {}
    };
  });
}
$('aAdd').onclick = () => editPago(null);
$('aSaldo').onclick = editSaldos;

// Cambiar de mes desde el gráfico: se nota arriba.
function irAMes(m){

// ---------- análisis ----------
function barras12(){
  const all12 = []; for (let i = 11; i >= 0; i--) all12.push(addMonth(cur, -i));
  const tot = all12.map(mm => sum(D.pagos.filter(p => p.mes === mm && p.tipo === 'Gasto')));
  const max = Math.max(1, ...tot);
  $('bars').innerHTML = all12.map((mm,i) => `<button class="bar ${mm === cur ? 'sel' : ''}" data-m="${mm}" aria-label="${monthName(mm)}: ${eur(tot[i])}">
      <i style="height:${Math.max(2, tot[i]/max*100)}%">${mm === cur ? `<em class="num">${eur(tot[i])}</em>` : ''}</i>
      <span aria-hidden="true">${cap(monthName(mm,{month:'short'}).replace('.','').slice(0,1))}</span></button>`).join('');
  $('bars').querySelectorAll('.bar').forEach(b => b.onclick = () => irAMes(b.dataset.m));
  const con = tot.filter(v => v > 0);
  $('media').textContent = con.length ? `Media ${eur(con.reduce((a,b)=>a+b,0)/con.length)}` : '';

}
let periodo = 1;
document.querySelectorAll('input[name=periodo]').forEach(r => r.onchange = () => { periodo = +r.value; renderAnalisis(); });

function renderAnalisis(){
  barras12();
  const desde = addMonth(cur, -(periodo - 1));
  // Las devoluciones se restan de la compra a la que corresponden (mismo comercio, hasta 45 días antes).
  const per = D.pagos.filter(p => p.tipo === 'Gasto' && p.mes >= desde && p.mes <= cur);
  const net = new Map(per.filter(p => p.importe > 0).map(p => [p, p.importe]));
  const porCom = new Map(); net.forEach((v, p) => { if (!porCom.has(p.comercio)) porCom.set(p.comercio, []); porCom.get(p.comercio).push(p); });
  per.filter(p => p.importe < 0).sort((a,b) => a.fecha.localeCompare(b.fecha)).forEach(r => {
    let left = -r.importe; const t = new Date(r.fecha).getTime();
    (porCom.get(r.comercio) || []).filter(p => p.comercio === r.comercio && new Date(p.fecha).getTime() <= t && t - new Date(p.fecha).getTime() < 45 * 864e5)
      .sort((a,b) => b.fecha.localeCompare(a.fecha)).forEach(p => { const d = Math.min(left, net.get(p)); net.set(p, net.get(p) - d); left -= d; });
  });
  const g = [...net].filter(([,v]) => v > 0.005).map(([p,v]) => ({...p, importe: v}));
  const total = sum(g), gastado = sum(per);   // gastado: neto de todas las devoluciones, igual que en Movimientos
  // días del periodo (hasta hoy si es el mes en curso)
  const hoyK = today(), ini = desde + '-01';
  const finMes = new Date(Date.UTC(+cur.slice(0,4), +cur.slice(5,7), 0)).toISOString().slice(0,10);
  const fin = finMes < hoyK ? finMes : hoyK;
  const diasP = []; for (let d = new Date(ini + 'T12:00:00Z'); d.toISOString().slice(0,10) <= fin; d.setUTCDate(d.getUTCDate() + 1)) diasP.push(d.toISOString().slice(0,10));
  const porDia = {}; g.forEach(p => porDia[p.dia] = (porDia[p.dia] || 0) + p.importe);
  const sinGastar = diasP.filter(d => !porDia[d]).length;
  const perLbl = periodo === 1 ? 'en ' + monthName(cur, {month: 'long'}) : `en ${periodo} meses`;
  $('kpis').innerHTML = `<div class="hero"><span class="label">Has gastado ${perLbl}</span><span class="big num">${eur(gastado)}</span>
    <span class="status num">${eur(diasP.length ? gastado / diasP.length : 0)} al día${sinGastar ? ` · ${sinGastar} ${sinGastar === 1 ? 'día' : 'días'} sin gastar` : ''}</span></div>`;

  // En qué: categorías ordenadas, con barra a escala del mayor.
  const cats = {}; g.forEach(p => cats[p.categoria] = (cats[p.categoria] || 0) + p.importe);
  const cl = Object.entries(cats).sort((a,b) => b[1] - a[1]);
  const big = cl.slice(0, 7), rest = cl.slice(7).reduce((s,[,v]) => s + v, 0);
  if (rest > 0) big.push(['Resto', rest]);
  const cmax = Math.max(1, ...big.map(x => x[1]));
  $('cats').innerHTML = total ? big.map(([k,v]) => `<div class="rk"><span class="c">${esc(k)}</span><b class="num">${eur(v)}<small>${Math.round(v / total * 100)} %</small></b>
    <span class="meter" aria-hidden="true"><i style="width:${v / cmax * 100}%"></i></span></div>`).join('') : '<p class="empty">No hay gastos en este periodo.</p>';

  // comercios
  const com = {}; g.forEach(p => { const c = com[p.comercio] || (com[p.comercio] = {t:0, n:0, cat:p.categoria}); c.t += p.importe; c.n++; });
  // Tocar un comercio lo busca en Movimientos.
  $('topCom').innerHTML = Object.entries(com).sort((a,b) => b[1].t - a[1].t).slice(0, 5).map(([k,c]) => `<button class="item" data-q="${esc(k)}">${icon(c.cat)}<span class="c">${esc(k)}</span><span class="a num">${eur(c.t)}</span><span class="s">${c.n} ${c.n === 1 ? 'vez' : 'veces'} · ${eur(c.t / c.n)} de media</span></button>`).join('') || '<p class="empty">No hay gastos en este periodo.</p>';
  $('topCom').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { busqueda = b.dataset.q.toLowerCase(); $('search').value = b.dataset.q; catSel = null; movLimit = 60; setView('movs'); });
}

// ---------- movimientos ----------
$('search').addEventListener('input', e => { busqueda = e.target.value.trim().toLowerCase(); movLimit = 60; renderMovs(); });
$('filters').querySelectorAll('button[data-f]').forEach(b => b.onclick = () => {
  filtro = b.dataset.f; catSel = null; movLimit = 60;
  renderMovs();
});
function renderMovs(){
  // "Sin categoría" y la búsqueda miran todos los meses; el resto, el mes elegido.
  const global = filtro === 'sin' || busqueda;
  let list = D.pagos.filter(p => global || p.mes === cur);
  if (filtro === 'gastos') list = list.filter(p => p.tipo === 'Gasto');
  if (filtro === 'sin') list = list.filter(p => p.categoria === 'Sin categoría');
  if (filtro === 'ingresos') list = list.filter(p => p.tipo === 'Ingreso');
  if (filtro === 'otros') list = list.filter(p => p.tipo === 'Deuda' || p.tipo === 'Personas' || p.tipo === 'Interno');
  if (catSel && !global) list = list.filter(p => p.tipo === 'Gasto' && catSel.incluye.includes(p.categoria));
  if (busqueda) list = list.filter(p => (p.comercio + ' ' + p.categoria + ' ' + (p.cuenta||'')).toLowerCase().includes(busqueda));
  list.sort((a,b) => b.fecha.localeCompare(a.fecha));
  // Filtros: el de categoría (desde Para gastar) sale como chip que se quita.
  const fl = $('filters'); fl.querySelector('.sel')?.remove();
  fl.querySelectorAll('button[data-f]').forEach(x => x.setAttribute('aria-pressed', !catSel && x.dataset.f === filtro));
  if (catSel && !global) {
    fl.insertAdjacentHTML('afterbegin', `<button class="sel" aria-label="Quitar filtro ${esc(catSel.nombre)}">${esc(catSel.nombre)}${svg('ui-x')}</button>`);
    fl.querySelector('.sel').onclick = () => { catSel = null; renderMovs(); };
  }
  // Cabecera: lo gastado en el mes (o en la categoría) y la media por día.
  const ing = filtro === 'ingresos';
  if (global) $('movsTot').innerHTML = `<p class="note">${busqueda ? 'Buscando en todos los meses' : 'Sin categoría, de todos los meses'} · ${list.length} ${list.length === 1 ? 'movimiento' : 'movimientos'}</p>`;
  else if (filtro === 'otros') $('movsTot').innerHTML = '';
  else if (ing) $('movsTot').innerHTML = `<div class="card movtot"><span class="l">Ingresos de ${monthName(cur, {month: 'long'})}</span><b class="num">${eur(-list.reduce((a,p) => a + salida(p), 0))}</b></div>`;
  else {
    const g = sum(list.filter(p => p.tipo === 'Gasto')), now = monthKey(new Date());
    const dias = cur === now ? Number(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',day:'numeric'}).format(new Date())) : new Date(Date.UTC(+cur.slice(0,4), +cur.slice(5,7), 0)).getUTCDate();
    $('movsTot').innerHTML = `<div class="card movtot"><span class="l">${catSel ? esc(catSel.nombre) + ' en ' : 'Gastado en '}${monthName(cur, {month: 'long'})}</span>
      <b class="num">${eur(g)}</b><span class="l num">${eur(g / dias)} al día de media</span>
</div>`;
  }
  const vis = list.slice(0, movLimit), byDay = [];
  vis.forEach(p => { const g = byDay[byDay.length - 1]; if (g && g.dia === p.dia) g.items.push(p); else byDay.push({dia: p.dia, items: [p]}); });
  let html = byDay.map(g => `<section class="group"><div class="ghrow sm"><h3>${cap(dayName(g.dia))}</h3><span class="ghnote num">${ing ? '+' + eur2(-g.items.reduce((a,p) => a + salida(p), 0)) : eur2(sum(g.items.filter(p => p.tipo === 'Gasto')))}</span></div>
    <div class="card"><div class="list">${g.items.map(p => `<button class="item mov" data-id="${p.id}">${icon(p.categoria)}<span class="c">${esc(p.comercio)}</span>
      <span class="a num ${salida(p) < 0 ? 'neg' : ''}">${salida(p) < 0 ? '+' + eur2(-salida(p)) : eur2(salida(p))}</span>
      <span class="s">${p.categoria === 'Sin categoría' ? '<span class="tag">Sin categoría</span>' : esc(p.categoria)}</span></button>`).join('')}</div></div></section>`).join('');
  if (list.length > movLimit) html += `<button class="ghost" id="moreMovs">Ver ${Math.min(200, list.length - movLimit)} más</button>`;
  // Vacío: dice por qué y qué hacer.
  const vacio = busqueda ? `<p class="empty">No hay movimientos con «${esc($('search').value.trim())}».<button class="linkbtn" id="clrQ">Borrar la búsqueda</button></p>`
    : filtro === 'sin' ? '<p class="empty">Todo tiene categoría.</p>'
    : `<p class="empty">No hay movimientos en ${monthName(cur, {month: 'long'})}.<button class="linkbtn" id="addQ">Añadir uno</button></p>`;
  $('movs').innerHTML = html || `<div class="card">${vacio}</div>`;
  if ($('clrQ')) $('clrQ').onclick = () => { busqueda = ''; $('search').value = ''; renderMovs(); };
  if ($('addQ')) $('addQ').onclick = () => editPago(null);
  $('movs').querySelectorAll('.item').forEach(b => b.onclick = () => editPago(D.pagos.find(p => p.id == b.dataset.id)));
  if ($('moreMovs')) $('moreMovs').onclick = () => { movLimit += 200; renderMovs(); };
}

// ---------- hoja de edición ----------
// Hoja inferior: el fondo queda inerte, el foco entra en la hoja y vuelve al cerrar.
// Se cierra con la ✕, tocando fuera, con Escape o deslizando hacia abajo; si has cambiado algo, pregunta antes.
let volverA = null, volverSel = null, foto = '';
const ATTR_FOCO = ['data-id','data-efijo','data-edeuda','data-fijo','data-deuda','data-k','data-cat'];
const selDe = el => { if (!el || el === document.body) return null; if (el.id) return '#' + CSS.escape(el.id);
  const a = ATTR_FOCO.find(a => el.hasAttribute(a)); return a ? `[${a}="${CSS.escape(el.getAttribute(a))}"]` : null; };
const fotoForm = () => [...$('sheet').querySelectorAll('input,select,textarea')].map(x => x.type === 'checkbox' || x.type === 'radio' ? x.checked : x.value).join('\u0001');
function openSheet(html, onReady){
  volverA = document.activeElement; volverSel = selDe(volverA);
  const sh = $('sheet');
  sh.innerHTML = '<button class="grab" aria-hidden="true" tabindex="-1"></button>' + html; sh.style.transform = '';
  $('scrim').hidden = false; document.documentElement.style.overflow = 'hidden';
  ['app','tabs','navbar'].forEach(id => $(id).inert = true);
  sh.querySelector('.x').onclick = pedirCierre; sh.querySelector('.grab').onclick = pedirCierre;
  onReady && onReady(sh);
  foto = fotoForm();
  if (!sh.contains(document.activeElement)) sh.querySelector('h2').focus();
}
function closeSheet(){
  $('scrim').hidden = true; document.documentElement.style.overflow = ''; $('sheet').innerHTML = '';
  ['app','tabs','navbar'].forEach(id => $(id).inert = false);
  const a = volverA, s2 = volverSel; volverA = volverSel = null;
  requestAnimationFrame(() => { const el = document.contains(a) ? a : s2 && document.querySelector(s2); el?.focus(); });
}
function pedirCierre(){
  if (fotoForm() === foto) return closeSheet();
  confirmar('¿Descartar los cambios?', 'Descartar', closeSheet, 'Seguir editando', true);
}
$('scrim').addEventListener('click', e => { if (e.target === $('scrim')) pedirCierre(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('scrim').hidden) { e.preventDefault(); $('sheet').querySelector('.confirm') ? $('cfNo').click() : pedirCierre(); } });
// Deslizar hacia abajo desde arriba de la hoja.
(() => {
  const sh = $('sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, {passive: true});
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = dy ? `translateY(${dy}px)` : ''; }, {passive: true});
  sh.addEventListener('touchend', () => { if (y0 == null) return; y0 = null; sh.style.transform = ''; if (dy > 110) pedirCierre(); });
})();
const hd = t => `<div class="hd"><h2 id="sheetT" tabindex="-1">${t}</h2><button class="ibtn x" type="button" aria-label="Cerrar"><span>${svg('ui-x')}</span></button></div>`;
// Confirmación dentro de la hoja, con Cancelar. Sustituye al "toca otra vez".
function confirmar(pregunta, accion, fn, cancelar = 'Cancelar', peligro = false){
  const sh = $('sheet'), antes = document.activeElement; sh.querySelector('.confirm')?.remove();
  sh.insertAdjacentHTML('beforeend', `<div class="confirm" role="alertdialog" aria-labelledby="cfq"><p id="cfq">${pregunta}</p>
    <div class="row"><button type="button" class="${peligro ? 'danger solid' : 'primary'}" id="cfOk">${accion}</button><button type="button" class="ghost" id="cfNo">${cancelar}</button></div></div>`);
  $('cfNo').onclick = () => { sh.querySelector('.confirm').remove(); (sh.contains(antes) ? antes : sh.querySelector('h2')).focus(); };

const pmDe = (tipo, id, mes = cur) => D.pm.find(r => r.tipo === tipo && r.ref_id === id && r.mes === mes);
const enMes = (desde, hasta, m = cur) => (!desde || desde.slice(0,7) <= m) && (!hasta || hasta.slice(0,7) >= m);
function fijosDelMes(m = cur){ return D.fijos.filter(f => f.activo && enMes(f.desde, f.hasta, m)); }
function cuotasDelMes(m = cur){
  return D.deudas.filter(d => {
    const r = pmDe('deuda', d.id, m);
    if (r) return true;                                     // pagada este mes: se queda en la lista
    if (d.pagada) return false;
    if (d.cuota) return !d.fin || d.fin.slice(0,7) >= m;    // cuota mensual hasta el final
    return d.fin && d.fin.slice(0,7) === m;                 // pago único: su mes
  });
}

let verProx = false;
function estadoMes(){
  if (cur < INICIO_SEGUIMIENTO) return {items:[], total:0, pagado:0};
  const items = [
    ...fijosDelMes().map(f => ({importe: (pmDe('fijo', f.id)?.importe ?? f.importe) * 1, cuenta: f.cuenta, done: !!pmDe('fijo', f.id)})),
    ...cuotasDelMes().map(d => { const r = pmDe('deuda', d.id); return {importe: Number(r?.importe ?? (d.cuota || d.pendiente)), cuenta: d.cuenta, done: !!r}; }),
  ];
  return {items, total: items.reduce((s,i) => s + i.importe, 0), pagado: items.filter(i => i.done).reduce((s,i) => s + i.importe, 0)};
}
// Busca en los movimientos del mes algo que se parezca al fijo o a la deuda.
function visto(nombre, importe){
  const words = nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/[^a-z0-9]+/).filter(w => w.length > 3 && !['cuota','anual','prorrateada','devolver','pago','agua','casa','seguro','movil','abono','metro','gold','pago'].includes(w));
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  // Solo cuenta si el nombre coincide y el importe se parece (±15 %), para no dar falsos "cobrado".
  return D.pagos.find(p => p.mes === cur && p.importe > 0 && words.some(w => norm(p.comercio).includes(w)) && (!importe || Math.abs(p.importe - importe) <= importe * 0.15));
}
function renderMes(){

    </div>`;

  $('cuotas').innerHTML = cuotasDelMes().map(d => {
    const r = pmDe('deuda', d.id), imp = Number(r?.importe ?? (d.cuota || d.pendiente)), v = !r && visto(d.nombre, imp);

async function toggleFijo(f, btn){
  btn.disabled = true;

    const r = pmDe('fijo', f.id);

      n.mes = n.mes.slice(0,7); n.amortizado = 0; D.pm.push(n);
    }
  } catch (e) { if (!e.avisado) toast(navigator.onLine === false ? 'No se guardó: no hay conexión.' : 'No se guardó. Prueba otra vez.'); }
  render(); document.querySelector(`[data-fijo="${f.id}"]`)?.focus();

// Marcar una cuota baja la deuda por el capital (cuota menos intereses del mes); desmarcar lo devuelve.
async function toggleDeuda(d, btn){
  btn.disabled = true;
  try {
    const r = pmDe('deuda', d.id);
    if (r) {
      await write(sb.from('pagos_mes').delete().eq('id', r.id));
      D.pm = D.pm.filter(x => x !== r);
      const upd = {pendiente: r2(d.pendiente + r.amortizado), pagada: false, pagada_el: null};
      if (d.cuota && d.cuotas_restantes != null && r.amortizado) upd.cuotas_restantes = d.cuotas_restantes + 1;
      if (r.amortizado) Object.assign(d, prepDeuda((await write(sb.from('deudas').update(upd).eq('id', d.id)))[0]));
    } else {
      // Antes del mes en que se apuntó el saldo, la cuota ya está descontada: solo se marca.
      const cuenta = !d.a_fecha || cur >= d.a_fecha.slice(0,7);
      let amort = 0, imp;
      if (d.cuota) { imp = d.cuota; if (cuenta) amort = Math.max(0, Math.min(d.pendiente, d.cuota - d.pendiente * (d.tin || 0) / 1200)); }
      else { imp = d.pendiente; amort = d.pendiente; }
      amort = r2(amort);
      const [n] = await write(sb.from('pagos_mes').insert({mes: cur + '-01', tipo:'deuda', ref_id: d.id, importe: imp, amortizado: amort, cuenta: d.cuenta, pagado_el: today()}));
      n.mes = n.mes.slice(0,7); n.amortizado = Number(n.amortizado); D.pm.push(n);
      if (amort) {
        const pend = r2(d.pendiente - amort);
        const upd = {pendiente: Math.max(0, pend)};
        if (d.cuota && d.cuotas_restantes != null) upd.cuotas_restantes = Math.max(0, d.cuotas_restantes - 1);
        if (pend <= 0.01) Object.assign(upd, {pagada: true, pagada_el: today()});
        Object.assign(d, prepDeuda((await write(sb.from('deudas').update(upd).eq('id', d.id)))[0]));
        if (d.pagada) toast(`${d.nombre}: ¡liquidada!`);
      }
    }
  } catch (e) { if (!e.avisado) toast(navigator.onLine === false ? 'No se guardó: no hay conexión.' : 'No se guardó. Prueba otra vez.'); }
  render(); document.querySelector(`[data-deuda="${d.id}"]`)?.focus();
}

      <div class="actions">
        <button class="primary" type="submit">${nuevo ? 'Añadir' : 'Guardar'}</button>
        ${nuevo ? '' : '<button class="danger" type="button" id="fdel">Dejar de pagar</button>'}
      </div>
    </form>`, () => {
      if (!nuevo) confirmBtn($('fdel'), `¿Dejar de contarlo desde ${monthName(mesQuitar, {month: 'long'})}? Los meses anteriores se quedan como están.`, async () => {
        // Se cierra en el mes anterior para no perder el historial.
        try { Object.assign(f, (await write(sb.from('gastos_fijos').update({hasta: addMonth(mesQuitar, -1) + '-28'}).eq('id', f.id)))[0]); f.importe = Number(f.importe); closeSheet(); render(); toast(mesQuitar === cur ? 'Quitado desde este mes' : 'Quitado desde ' + monthName(mesQuitar, {month: 'long'})); } catch {}
      });
      $('ff').addEventListener('submit', async e => {
        e.preventDefault();
        const imp = parseNum($('fi').value);
        if (!$('fc').value.trim()) return fieldErr($('fc'), 'Escribe el concepto.');
        if (!isFinite(imp) || imp <= 0) return fieldErr($('fi'), 'Escribe un importe, por ejemplo 39,90.');
        const dia = parseInt($('fd').value) || null;
        const row = {concepto: $('fc').value.trim(), importe: r2(imp), dia: dia && dia >= 1 && dia <= 31 ? dia : null, cuenta: $('fcu').value || null,
          desde: $('fde').value ? $('fde').value + '-01' : null, hasta: $('fha').value ? $('fha').value + '-28' : null, activo: true};
        try {
          if (nuevo) { const [n] = await write(sb.from('gastos_fijos').insert(row)); n.importe = Number(n.importe); D.fijos.push(n); }
          else {
            Object.assign(f, (await write(sb.from('gastos_fijos').update(row).eq('id', f.id)))[0]); f.importe = Number(f.importe);
            const r = pmDe('fijo', f.id);
            if (r && $('fpm')) { const v = parseNum($('fpm').value); if (isFinite(v) && v !== Number(r.importe)) { await write(sb.from('pagos_mes').update({importe: r2(v)}).eq('id', r.id)); r.importe = r2(v); } }
          }
          closeSheet(); render(); toast(nuevo ? 'Añadido' : 'Guardado');
        } catch {}
      });
    });
}

// ---------- deudas ----------
$('addDeuda').onclick = () => editDeuda(null);
function renderDeudas(){
  const {plan, deudas} = D;
  const act = deudas.filter(d => !d.pagada).sort((a,b) => b.pendiente - a.pendiente);
  const liq = deudas.filter(d => d.pagada).sort((a,b) => (b.pagada_el||'').localeCompare(a.pagada_el||''));
  const total = deudaActual();
  const now = monthKey(new Date());
  $('deudaHoy').textContent = eur(total);
  const fin = plan.find(p => p.deuda_final <= 0.5);
  $('libre').textContent = fin ? `Plan: sin deudas en ${monthName(fin.mes)}` : '';
  const start = deudas.reduce((s,d) => s + d.pendiente, 0) + D.pm.filter(r => r.tipo === 'deuda').reduce((s,r) => s + r.amortizado, 0);
  $('debtChart').innerHTML = debtChart(start, plan, now, total);
  const planHoy = plan.filter(p => p.mes < now).pop();
  $('debtVsPlan').textContent = planHoy ? (total <= planHoy.deuda_final + 1 ? `Vas por delante del plan: tocaba ${eur(planHoy.deuda_final)} a final de ${monthName(planHoy.mes,{month:'long'})}.` : `Vas ${eur(total - planHoy.deuda_final)} por detrás del plan de ${monthName(planHoy.mes,{month:'long'})}.`) : 'La línea es el plan; el punto, hoy.';
  const row = d => {
    const pagado = D.pm.filter(r => r.tipo === 'deuda' && r.ref_id === d.id).reduce((s,r) => s + r.amortizado, 0);
    const pct = d.pendiente + pagado ? pagado / (d.pendiente + pagado) * 100 : 100;
    return `<button class="debt" data-id="${d.id}">
      <span class="h"><span>${esc(d.nombre)}</span><span class="num">${d.pagada ? 'Liquidada' : eur(d.pendiente)}</span></span>
      <span class="s">${d.pagada ? (d.pagada_el ? 'El ' + new Date(d.pagada_el+'T12:00:00Z').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}) : '') :
        [d.cuota ? `${eur(d.cuota)}/mes` : 'Pago único', d.fin ? `hasta ${monthName(d.fin.slice(0,7),{month:'short',year:'numeric'}).replace('.','')}` : ''].filter(Boolean).join(' · ')}</span>
      ${!d.pagada && pagado ? `<span class="meter"><i style="width:${pct}%"></i></span>` : ''}
    </button>`;
  };
  $('debts').innerHTML = act.map(row).join('') || '<p class="empty">No te queda ninguna deuda.</p>';
  $('paidSec').hidden = !liq.length;
  $('debtsPaid').innerHTML = liq.map(row).join('');
  $('v-deudas').querySelectorAll('.debt').forEach(b => b.onclick = () => editDeuda(D.deudas.find(d => d.id == b.dataset.id)));
}
function debtChart(start, plan, now, hoyV){
  const pts = [{mes: '2026-10', v: start}, ...plan.map(p => ({mes: p.mes, v: p.deuda_final}))];
  if (pts.length < 2) return '';
  const W = 520, H = 200, L = 10, R = 10, T = 22, B = 34;
  const max = Math.max(start, hoyV, ...pts.map(p => p.v));
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (1 - v / max) * (H - T - B);
  const line = pts.map((p,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = `${line}L${x(pts.length-1)},${H-B}L${x(0)},${H-B}Z`;
  let ni = pts.findIndex(p => p.mes >= now); if (ni < 0) ni = pts.length - 1;
  const years = pts.map((p,i) => ({i, y: p.mes.slice(0,4), m: p.mes.slice(5)})).filter(p => p.i === 0 || (p.m === '01' && p.i > 3));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(`Plan de deuda: de ${eur(start)} a 0 € en ${monthName(pts[pts.length-1].mes)}. Hoy debes ${eur(hoyV)}.`)}">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>
    <path d="${area}" fill="var(--accent-soft)"/>
    <path d="${line}" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-dasharray="7 6" stroke-linejoin="round"/>
    <circle cx="${x(ni)}" cy="${y(hoyV)}" r="8" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>
    ${years.map(p => `<text x="${x(p.i)}" y="${H-6}" text-anchor="${p.i === 0 ? 'start' : 'middle'}">${p.i === 0 ? monthName(pts[0].mes,{month:'short'}).replace('.','') + ' ' + p.y : p.y}</text>`).join('')}
    <text x="${W-R}" y="${y(0) - 12}" text-anchor="end">0 €</text>
  </svg>`;
}
function editDeuda(d){
  const nuevo = !d;
  const pagos = d ? D.pm.filter(r => r.tipo === 'deuda' && r.ref_id === d.id).sort((a,b) => b.mes.localeCompare(a.mes)) : [];
  openSheet(`${hd(nuevo ? 'Añadir deuda' : esc(d.nombre))}
    <form id="fdd" novalidate>
      <label class="f">Nombre<input id="dn" required value="${esc(d?.nombre || '')}" placeholder="Ej. Préstamo coche"></label>
      <div class="grid2">
        <label class="f">Pendiente hoy (€)<input id="dp" inputmode="decimal" autocomplete="off" required value="${d ? String(d.pendiente).replace('.',',') : ''}"></label>
        <label class="f">TIN (%)<input id="dt" inputmode="decimal" autocomplete="off" value="${d?.tin ? String(d.tin).replace('.',',') : ''}" placeholder="0"></label>
        <label class="f">Cuota al mes (€)<input id="dc" inputmode="decimal" autocomplete="off" value="${d?.cuota ? String(d.cuota).replace('.',',') : ''}"></label>
        <label class="f">Cuotas que quedan<input id="dr" inputmode="numeric" autocomplete="off" value="${d?.cuotas_restantes ?? ''}"></label>
        <label class="f">Termina / se paga en<input id="df" type="month" value="${d?.fin ? d.fin.slice(0,7) : ''}"></label>
        <label class="f">Sale de<select id="dcu"><option value="">Sin cuenta</option>${opts(CUENTAS, d?.cuenta || '')}</select></label>
      </div>
      <p class="small muted">Sin cuota, cuenta como un pago único en el mes en que se paga.</p>
      <label class="f">Notas<input id="dno" value="${esc(d?.notas || '')}"></label>
      ${!nuevo ? '<p class="small muted">Si el banco te da otro saldo, cámbialo en «Pendiente hoy».</p>' : ''}
      ${pagos.length ? `<div class="small muted">Pagos marcados: ${pagos.map(r => `${monthName(r.mes,{month:'short',year:'2-digit'}).replace('.','')} ${eur2(Number(r.importe))}`).join(' · ')}</div>` : ''}
      <div class="actions">
        <button class="primary" type="submit">${nuevo ? 'Añadir' : 'Guardar'}</button>
        ${nuevo ? '' : d.pagada ? '<button class="ghost" type="button" id="dre">Reabrir deuda</button>' : '<button class="ghost" type="button" id="dliq">Marcar liquidada</button>'}
      </div>
      ${nuevo ? '' : '<button class="danger sep" type="button" id="ddel">Borrar deuda</button>'}
    </form>`, () => {
      if (!nuevo && $('dliq')) $('dliq').onclick = () => confirmar('¿Marcarla como liquidada? El pendiente queda a 0 €.', 'Marcar liquidada', async () => {
        try { Object.assign(d, prepDeuda((await write(sb.from('deudas').update({pagada: true, pagada_el: today(), pendiente: 0, cuotas_restantes: d.cuota ? 0 : null}).eq('id', d.id)))[0])); closeSheet(); render(); toast(`${d.nombre}: ¡liquidada!`); } catch {}
      }, 'Cancelar');
      if (!nuevo && $('dre')) $('dre').onclick = async () => {
        try { Object.assign(d, prepDeuda((await write(sb.from('deudas').update({pagada: false, pagada_el: null}).eq('id', d.id)))[0])); closeSheet(); render(); toast('Reabierta: pon el pendiente real'); editDeuda(d); } catch {}
      };
      if (!nuevo) confirmBtn($('ddel'), '¿Borrar esta deuda y sus pagos? No se puede deshacer.', async () => {
        try { if (D.pm.some(r => r.tipo === 'deuda' && r.ref_id === d.id)) await write(sb.from('pagos_mes').delete().eq('tipo','deuda').eq('ref_id', d.id)); await write(sb.from('deudas').delete().eq('id', d.id)); } catch { return; }
        D.deudas = D.deudas.filter(x => x !== d); D.pm = D.pm.filter(r => !(r.tipo === 'deuda' && r.ref_id === d.id));
        closeSheet(); render(); toast('Borrada');
      });
      $('fdd').addEventListener('submit', async e => {
        e.preventDefault();
        const pend = parseNum($('dp').value), cuota = $('dc').value ? parseNum($('dc').value) : null, tin = $('dt').value ? parseNum($('dt').value) : 0;
        if (!$('dn').value.trim()) return fieldErr($('dn'), 'Ponle un nombre.');
        if (!isFinite(pend) || pend < 0) return fieldErr($('dp'), 'Escribe lo que debes hoy, por ejemplo 2.400.');
        if (cuota != null && !(cuota > 0)) return fieldErr($('dc'), 'Escribe la cuota o déjala vacía.');
        const row = {nombre: $('dn').value.trim(), pendiente: r2(pend), tin: isFinite(tin) ? tin : 0, cuota: cuota == null ? null : r2(cuota),
          cuotas_restantes: $('dr').value ? parseInt($('dr').value) : null, fin: $('df').value ? $('df').value + '-01' : null,
          cuenta: $('dcu').value || null, notas: $('dno').value.trim() || null};
        if (nuevo || Math.abs(row.pendiente - d.pendiente) > 0.005) row.a_fecha = today();
        try {
          if (nuevo) D.deudas.push(prepDeuda((await write(sb.from('deudas').insert(row)))[0]));
          else Object.assign(d, prepDeuda((await write(sb.from('deudas').update(row).eq('id', d.id)))[0]));
          closeSheet(); render(); toast(nuevo ? 'Añadida' : 'Guardada');
        } catch {}
      });
    });
}

// ---------- ajustes ----------
function ajustes(){
  const hace = cargadoEn ? Math.round((Date.now() - cargadoEn) / 60000) : null;
  openSheet(`${hd('Ajustes')}
    <div class="card"><div class="lrow"><span>Datos cargados</span><b>${hace == null ? 'Aún no' : hace < 1 ? 'Ahora mismo' : `Hace ${hace} min`}</b></div>
    <div class="lrow"><span>Movimientos</span><b class="num">${D ? new Intl.NumberFormat('es-ES',{useGrouping:'always'}).format(D.pagos.length) : 0}</b></div></div>
    <div class="actions"><button class="primary" type="button" id="ajLoad">Actualizar datos</button></div>
    <button class="danger sep" type="button" id="ajOut">Olvidar la clave en este iPhone</button>`, () => {
    $('ajLoad').onclick = () => { closeSheet(); load(); };
    $('ajOut').onclick = () => confirmar('¿Olvidar la clave? Tendrás que pegarla otra vez para entrar.', 'Olvidar la clave', () => { closeSheet(); olvidar(); }, 'Cancelar', true);
  });
}

// Con la clave guardada se entra directo; si luego no vale, load() vuelve a la pantalla de entrar.
{ const k = leerClave(); if (k) { sb = cliente(k); show(true); } else show(false); }
</script>
